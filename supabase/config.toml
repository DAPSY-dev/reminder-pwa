project_id = "reminder-pwa"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth", "http://localhost:5173/auth?recovery=1", "http://localhost:5173/profile", "http://127.0.0.1:5173/auth", "http://127.0.0.1:5173/auth?recovery=1", "http://127.0.0.1:5173/profile"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[functions.dispatch-reminders]
verify_jwt = true

[functions.notification-action]
verify_jwt = true
